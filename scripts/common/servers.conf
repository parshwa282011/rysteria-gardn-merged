# Every process the deployment scripts build and run, in start order.
#   name          kind    arg            port   public hostname (cloudflared ingress)
# kinds:
#   master  the C master server
#   rrolf   a rrolf game server. arg = extra cmake options for that build ("-" = none).
#           The mode and the port are compiled in (RR_BIOME_SERVERS in
#           rrolf/Shared/StaticData.c): default 1234, pvp 1235, garden 1236, ctf 1237
#   gardn   the gardn server (WebAssembly on Node)
#   edge    web server for game.<domain>: the rrolf client at / and gardn under /gardn/
#   sync    syncd from dual-server-syncing/: backup + failover between machines.
#           Only started when SYNC_ENABLED=1 in ~/.rysteria-secrets/sync.env.
# Each one gets builds/<os>-<arch>/<name>/ and ~/.rysteria-secrets/<name>.env
#
# A hostname column may list several names separated by commas (same server).
# The hostnames must be the ones the rrolf client connects to (see
# rr_dom_get_socket_url in rrolf/Client/DOM.c). Delete a line to skip a server.
master         master  -              55554  api-game
rrolf-hc       rrolf   -              1234   hc-game,default-game
rrolf-pvp      rrolf   -DPVP=1        1235   pvp-game
rrolf-garden   rrolf   -DGARDEN=1     1236   ga-game,garden-game
rrolf-ctf      rrolf   -DCTF=1        1237   ctf-game
gardn          gardn   -              9001   -
edge           edge    -              8080   game
syncd          sync    -              -      -
